# Security updates arrive one advisory per pull request; routine tooling updates are grouped.
# Actions stay pinned to commit SHAs; Dependabot moves the SHA and its version comment together.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        dependency-type: development
        applies-to: version-updates

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        applies-to: version-updates
