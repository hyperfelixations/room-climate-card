# CI for the standalone room-climate-card repository.
# The workflow validates syntax, unit behavior, and browser behavior for
# pushes and pull requests targeting main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests (node:test + jsdom)
        run: npm run test:unit

      - name: Install Playwright's Chromium
        run: npx playwright install chromium

      - name: Browser tests (Playwright)
        run: npm run test:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
