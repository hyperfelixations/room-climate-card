# CI for the standalone room-climate-card repository.
#
# Two independent jobs, deliberately with no `needs:` between them. They answer
# different questions — "is the logic right" and "does it behave in a real browser" —
# and a failure in one says nothing about the other. Chaining them would hide the
# browser result on every unit failure, exactly when knowing both is most useful.
#
# Both jobs build the bundle themselves. That repeats one Rollup build, which is cheap,
# and it is what makes each status check meaningful on its own: no browser job can ever
# report green while testing an artifact that some other job produced.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow tests, it never publishes. Releases and tags are not part
# of it.
permissions:
  contents: read

jobs:
  unit:
    name: Code & Unit Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Nothing here pushes; leaving the token in .git/config would let any later
          # step write to the repository with it.
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # dist/ is not in the repository: the bundle is what src/ produces, and this is
      # where it gets produced. Every later step loads that artifact, so this has to
      # come first.
      #
      # The steps after it deliberately use the internal *:run scripts. The public
      # commands (npm run check / test:unit) build first themselves, which is what makes
      # them safe to run on their own — but in a pipeline that would repeat the same
      # Rollup build for no added guarantee.
      - name: Build the bundle from src/
        run: npm run build

      - name: Syntax check
        run: npm run check:run

      - name: Unit tests (node:test + jsdom)
        run: npm run test:unit:run

      # The seeded property test. Separate from the unit suite because it is a
      # different kind of evidence: randomized inputs against invariants rather than
      # named cases.
      - name: Property test (seeded fuzz)
        run: npm run test:fuzz:run

  browser:
    name: Browser Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Repeated on purpose — see the file header. This job must not be able to pass
      # against a bundle it did not produce from the source it checked out.
      - name: Build the bundle from src/
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install chromium

      - name: Browser tests (Playwright)
        run: npm run test:browser:run

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
