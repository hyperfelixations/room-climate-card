# CI for the standalone room-climate-card repository. Two independent jobs with no `needs:`
# between them; each builds the bundle itself so no job reports green against an artifact it
# did not produce. The large property sweep and mutation testing run weekly, not here. See
# internal dev doc §4 "GitHub-Workflows".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow tests, it never publishes. Releases and tags are not part of it.
permissions:
  contents: read

jobs:
  unit:
    # Keep the established check name: external branch-protection rules may refer to it. The
    # command runs every Node layer, not only direct unit tests.
    name: Code & Unit Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Nothing here pushes; a persisted token would let a later step write to the repo.
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # dist/ is not committed; build it here, before every step that loads it. The steps
      # after use the internal *:run scripts so the pipeline does not repeat this build.
      - name: Build the bundle from src/
        run: npm run build

      - name: Syntax check
        run: npm run check:run

      # Every test/**/*.test.js: unit, component, contract, architecture, characterization,
      # the known-defect register and the small deterministic property run.
      - name: All Node test layers
        run: npm run test:node:run

  browser:
    name: Browser Tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Repeated on purpose: this job must not pass against a bundle another job produced.
      - name: Build the bundle from src/
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit

      - name: Source-normalized coverage across unit, bundle and browser layers
        run: npm run coverage

      # coverage already ran the full Chromium suite; run only the Firefox/WebKit core here.
      - name: Firefox and WebKit core
        run: npm run test:browser:cross-engine:run

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-layers
          path: coverage/
          retention-days: 14

      # `always()`: a flaky result passes the job, so a `failure()` condition would drop the
      # retry trace — and two specs ask for retries (playwright.config.js).
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
