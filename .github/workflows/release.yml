# This workflow prepares a release candidate. It never publishes a release.
# Only the repository owner may start it and publish the resulting draft.

name: Release Candidate

run-name: >-
  Release candidate v${{ inputs.version }} from ${{ github.ref_name }} at ${{ inputs.expected_sha }}
  (${{ inputs.release_kind }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version, for example 2.38.0 or 2.39.0-dev.1"
        required: true
        type: string
      expected_sha:
        description: "Full 40-character commit SHA approved for release"
        required: true
        type: string
      release_kind:
        description: "Stable creates a normal draft; dev creates a pre-release draft"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - dev

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.0"
  RELEASE_ASSET: room-climate-card.js

jobs:
  build-and-test:
    name: Build, unit and fuzz tests
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      artifact_sha256: ${{ steps.artifact-metadata.outputs.sha256 }}
      baseline_anchor: ${{ steps.baseline-anchor.outputs.posix }}
      release_line: ${{ steps.release-metadata.outputs.line }}
      release_major: ${{ steps.release-metadata.outputs.major }}
      release_sha: ${{ steps.release-metadata.outputs.sha }}
      release_tag: ${{ steps.release-metadata.outputs.tag }}
      release_title: ${{ steps.release-metadata.outputs.title }}

    steps:
      # Full history: the validation reads every tag and the remote release branches.
      - name: Check out the selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing in this job pushes; a persisted token would let a later step write to the repo.
          persist-credentials: false

      # The approved commit may be any commit in the history of the selected branch, main or a
      # release line; see internal dev doc §4 "Release-Linien".
      - name: Validate branch, SHA, version and HACS contract
        id: release-metadata
        shell: pwsh
        env:
          ACTOR: ${{ github.actor }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SELECTED_REF: ${{ github.ref }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          $ErrorActionPreference = "Stop"

          $actualSha = $env:ACTUAL_SHA.ToLowerInvariant()
          $expectedSha = $env:EXPECTED_SHA.Trim().ToLowerInvariant()
          $version = $env:RELEASE_VERSION.Trim()
          $releaseKind = $env:RELEASE_KIND

          # A re-run keeps github.actor but may be started by someone else (github.triggering_actor).
          if ($env:ACTOR -ne $env:REPOSITORY_OWNER -or $env:TRIGGERING_ACTOR -ne $env:REPOSITORY_OWNER) {
            throw "Only the repository owner may start a release candidate."
          }
          $line = $null
          if ($env:SELECTED_REF -ceq "refs/heads/main") {
            $branch = "main"
          }
          elseif ($env:SELECTED_REF -cmatch '^refs/heads/(rcc/release-(0|[1-9][0-9]{0,8})\.x)$') {
            $branch = $Matches[1]
            $line = [long]$Matches[2]
          }
          else {
            throw "Release candidates must be started with branch 'main' or a release line rcc/release-<major>.x selected."
          }
          if ($expectedSha -notmatch '^[0-9a-f]{40}$') {
            throw "expected_sha must be the complete 40-character commit SHA."
          }
          git cat-file -e "$expectedSha^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Commit $expectedSha does not exist in this repository."
          }
          git merge-base --is-ancestor $expectedSha $actualSha
          if ($LASTEXITCODE -ne 0) {
            throw "Commit $expectedSha is not part of the $branch branch history."
          }

          # SemVer without leading zeros, at most nine digits per number so every number fits a
          # long. Case-sensitive and ASCII-only on purpose: -notmatch ignores case and \d accepts
          # every Unicode digit.
          switch ($releaseKind) {
            "stable" {
              if ($version -cnotmatch '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$') {
                throw "A stable version must look like 2.38.0."
              }
            }
            "dev" {
              if ($version -cnotmatch '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})-dev\.[1-9][0-9]{0,8}$') {
                throw "A dev pre-release version must look like 2.39.0-dev.1."
              }
            }
            default {
              throw "Unsupported release kind '$releaseKind'."
            }
          }
          $title = "Room Climate Card $version"

          $tag = "v$version"
          $existingTags = @(git tag --list $tag)
          if ($existingTags.Count -ne 0) {
            throw "Tag '$tag' already exists. Release tags are immutable; use a new version."
          }

          # Major, minor and patch of a version or a release tag; $null for anything else.
          function Read-ReleaseVersion([string]$text) {
            if ($text -cnotmatch '^v?(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-dev\.[1-9][0-9]{0,8})?$') {
              return $null
            }
            return [pscustomobject]@{
              Numbers = @([long]$Matches[1], [long]$Matches[2], [long]$Matches[3])
              Stable  = !$Matches[4]
            }
          }
          function Compare-ReleaseNumbers([long[]]$left, [long[]]$right) {
            for ($i = 0; $i -lt 3; $i++) {
              if ($left[$i] -ne $right[$i]) {
                return [Math]::Sign($left[$i] - $right[$i])
              }
            }
            return 0
          }
          function Read-CommitDates([string]$commit) {
            $dates = @(git log -1 --format="%at %ct" $commit) -split " "
            if ($LASTEXITCODE -ne 0 -or $dates.Count -ne 2) {
              throw "Could not read the dates of $commit."
            }
            return [pscustomobject]@{ Author = [long]$dates[0]; Committer = [long]$dates[1] }
          }

          $requested = Read-ReleaseVersion $version
          $major = $requested.Numbers[0]
          if ($null -ne $line -and $major -ne $line) {
            throw "The release line $branch releases only $line.x.y versions; $version is not one."
          }
          if ($null -eq $line) {
            git show-ref --verify --quiet "refs/remotes/origin/rcc/release-$major.x"
            if ($LASTEXITCODE -eq 0) {
              throw "Version $version belongs to the release line rcc/release-$major.x; start the candidate there."
            }
          }

          $releases = @()
          foreach ($name in @(git tag --list "v*")) {
            $existing = Read-ReleaseVersion $name
            if ($null -eq $existing) {
              continue
            }
            $commit = git rev-parse --verify --quiet "refs/tags/$name^{commit}"
            if ($LASTEXITCODE -ne 0 -or !$commit) {
              throw "Release tag $name does not point to a commit."
            }
            $releases += [pscustomobject]@{ Name = $name; Numbers = $existing.Numbers; Stable = $existing.Stable; Commit = $commit.Trim() }
          }

          # HACS offers the newest release by commit date, so a line ends once a higher major is out.
          foreach ($existing in $releases) {
            $existingMajor = $existing.Numbers[0]
            if ($null -eq $line -and $existingMajor -eq $major) {
              git merge-base --is-ancestor $existing.Commit $actualSha
              if ($LASTEXITCODE -ne 0) {
                throw "Release $($existing.Name) is not in the history of main, so major $major is released from its release line rcc/release-$major.x."
              }
            }
            if ($null -ne $line -and $existingMajor -gt $line) {
              if ($existing.Stable) {
                throw "Release line $line ended with $($existing.Name); HACS would offer a later $line.x release over it."
              }
              if ($releaseKind -eq "dev") {
                throw "Dev releases of line $line ended with the pre-release $($existing.Name); HACS would offer a later $line.x pre-release over it."
              }
            }
          }

          # GitHub orders releases by the author and committer date of their commit, so a stable
          # release must be the newest by version and by date, and contain every earlier stable
          # release of its major version.
          if ($releaseKind -eq "stable") {
            $stable = @($releases | Where-Object { $_.Stable })
            if ($null -ne $line -and @($stable | Where-Object { $_.Numbers[0] -eq $line }).Count -eq 0) {
              throw "Release line $line has no stable release yet; the first stable release of a major comes from main."
            }
            $releaseDates = Read-CommitDates $expectedSha
            foreach ($existing in $stable) {
              if ((Compare-ReleaseNumbers $existing.Numbers $requested.Numbers) -ge 0) {
                throw "Stable version $version must be higher than the existing release $($existing.Name)."
              }
              if ($existing.Numbers[0] -eq $major) {
                git merge-base --is-ancestor $existing.Commit $expectedSha
                if ($LASTEXITCODE -ne 0) {
                  throw "Release $($existing.Name) is not an ancestor of $expectedSha; a stable release must contain every earlier stable release of its major version."
                }
              }
              $existingDates = Read-CommitDates $existing.Commit
              if ($releaseDates.Author -le $existingDates.Author -or $releaseDates.Committer -le $existingDates.Committer) {
                throw "Commit $expectedSha is not newer than release $($existing.Name) by author and committer date; GitHub and HACS would not order it first. Release a new bump commit."
              }
            }
          }

          "tag=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "title=$title" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "sha=$expectedSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "line=$line" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "major=$major" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Check out the approved commit
        shell: pwsh
        env:
          APPROVED_SHA: ${{ steps.release-metadata.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          git checkout --detach $env:APPROVED_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out the approved commit."
          }
          if ((git rev-parse HEAD) -ne $env:APPROVED_SHA) {
            throw "The checkout is not at the approved commit."
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exactly from the lockfile
        run: npm ci

      - name: Audit dependencies and registry signatures
        run: npm run check:security

      - name: Validate version files and HACS manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          @'
          const fs = require("node:fs");

          const version = process.env.RELEASE_VERSION.trim();
          const asset = process.env.RELEASE_ASSET;
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const hacs = JSON.parse(fs.readFileSync("hacs.json", "utf8"));
          const cardMetadata = fs.readFileSync("src/core/card-metadata.js", "utf8");

          const versions = new Map([
            ["package.json", packageJson.version],
            ["package-lock.json root", packageLock.version],
            ["package-lock.json package", packageLock.packages?.[""]?.version],
          ]);
          for (const [source, actual] of versions) {
            if (actual !== version) {
              throw new Error(`${source} contains version '${actual}', expected '${version}'.`);
            }
          }

          const versionDeclaration = `export const CARD_VERSION = "${version}";`;
          if (!cardMetadata.includes(versionDeclaration)) {
            throw new Error(`CARD_VERSION does not exactly match '${version}'.`);
          }
          if (typeof hacs.name !== "string" || hacs.name.trim() === "") {
            throw new Error("hacs.json must contain a non-empty name.");
          }
          if (hacs.filename !== asset) {
            throw new Error(`hacs.json filename must be '${asset}'.`);
          }

          console.log(`Version ${version} and HACS asset ${asset} are consistent.`);
          '@ | node
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # The release asset is built here from the approved commit's sources; every downstream
      # job receives this exact artifact and re-checks its SHA-256 before use.
      - name: Build the release asset from src/
        run: npm run build

      - name: Check bundle syntax
        run: npm run check:run

      - name: Run the complete Node test suite
        run: npm run test:node:run

      - name: Run an additional release property sweep
        env:
          ROOM_CLIMATE_CARD_FUZZ_CASES: "2500"
          ROOM_CLIMATE_CARD_METAMORPHIC_CASES: "1200"
          ROOM_CLIMATE_CARD_FUZZ_SEED: ${{ github.run_id }}
          ROOM_CLIMATE_CARD_METAMORPHIC_SEED: ${{ github.run_id }}
          ROOM_CLIMATE_CARD_DISCOVERY_CASES: "2500"
          ROOM_CLIMATE_CARD_DISCOVERY_SEED: ${{ github.run_id }}
        run: npm run test:property:run

      # Provenance: the digest covers every committed baseline, so the draft can state which
      # frozen evidence the tested bundle was accepted against.
      - name: Record the characterization baseline anchor
        id: baseline-anchor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = (npm run --silent baseline:anchor) -join "`n"
          $digest = [regex]::Match($report, 'posix\s+([0-9a-f]{64})')
          if (-not $digest.Success) {
            throw "baseline:anchor did not report a posix digest:`n$report"
          }
          "posix=$($digest.Groups[1].Value)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          $report

      - name: Record release asset checksum
        id: artifact-metadata
        shell: pwsh
        run: |
          $asset = "dist/$env:RELEASE_ASSET"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw "Expected release asset '$asset' was not created."
          }
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $asset).Length
          "sha256=$hash" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "Built $asset ($size bytes, SHA-256 $hash)"

      - name: Upload the exact candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ steps.release-metadata.outputs.tag }}
          path: dist/room-climate-card.js
          if-no-files-found: error
          retention-days: 14

  # HACS validates the published releases and the default branch, so it can only pass once a stable
  # release exists; the verdict of the very first release comes from the Validate workflow after publishing.
  release-state:
    name: Published release state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stable_release_exists: ${{ steps.state.outputs.stable_release_exists }}
    steps:
      - name: Look for a published stable release
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          if [[ -n "$stable_tags" ]]; then
            echo "stable_release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable_release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Repeated from the Validate workflow so a release candidate carries its own HACS verdict.
  hacs-validation:
    name: HACS validation
    needs: release-state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: HACS validation
        if: needs.release-state.outputs.stable_release_exists != 'false'
        uses: hacs/action@main
        with:
          category: plugin

      - name: Note the skipped HACS validation
        if: needs.release-state.outputs.stable_release_exists == 'false'
        shell: bash
        run: |
          {
            echo "## HACS validation skipped"
            echo
            echo "No stable release is published yet, so HACS has no release asset to validate."
            echo "Run the Validate workflow after publishing the first release."
          } >> "$GITHUB_STEP_SUMMARY"

  browser-tests:
    name: Browser tests on candidate bundle
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-and-test.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exactly from the lockfile
        run: npm ci

      - name: Download the exact candidate bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate-${{ needs.build-and-test.outputs.release_tag }}
          path: dist

      - name: Verify the downloaded bundle checksum
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.build-and-test.outputs.artifact_sha256 }}
        run: |
          $asset = "dist/$env:RELEASE_ASSET"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw "The candidate bundle is missing."
          }
          $actualHash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:EXPECTED_SHA256) {
            throw "The downloaded bundle checksum does not match the tested bundle."
          }

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit

      - name: Run browser tests once without retries
        run: npm run test:browser:run -- --retries=0

      - name: Upload Playwright report after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  create-draft:
    name: Create unpublished GitHub draft
    needs:
      - build-and-test
      - browser-tests
      - hacs-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BASELINE_ANCHOR: ${{ needs.build-and-test.outputs.baseline_anchor }}
      EXPECTED_SHA: ${{ needs.build-and-test.outputs.release_sha }}
      EXPECTED_SHA256: ${{ needs.build-and-test.outputs.artifact_sha256 }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_KIND: ${{ inputs.release_kind }}
      RELEASE_LINE: ${{ needs.build-and-test.outputs.release_line }}
      RELEASE_MAJOR: ${{ needs.build-and-test.outputs.release_major }}
      RELEASE_TAG: ${{ needs.build-and-test.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.build-and-test.outputs.release_title }}

    steps:
      - name: Download the tested release asset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate-${{ needs.build-and-test.outputs.release_tag }}
          path: release-asset

      - name: Verify the release asset one final time
        shell: bash
        run: |
          set -euo pipefail
          asset="release-asset/$RELEASE_ASSET"
          test -f "$asset"
          actual_sha256="$(sha256sum "$asset" | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "The final release asset does not match the tested candidate." >&2
            exit 1
          fi

      - name: Refuse to reuse an existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists. Use a new version." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Release tags are immutable; use a new version." >&2
            exit 1
          fi

      # Drafts have no tag until they are published, so the tag checks of build-and-test cannot
      # see them; only this job's contents: write lists them.
      - name: List every release including drafts
        shell: bash
        env:
          RELEASE_LIST: ${{ runner.temp }}/releases.tsv
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, .draft, .prerelease] | @tsv' > "$RELEASE_LIST"

      - name: Refuse a release that would cross a release line
        shell: pwsh
        env:
          RELEASE_LIST: ${{ runner.temp }}/releases.tsv
        run: |
          $ErrorActionPreference = "Stop"
          $major = [long]$env:RELEASE_MAJOR
          foreach ($row in @(Get-Content -LiteralPath $env:RELEASE_LIST)) {
            $name, $draft, $prerelease = $row -split "`t"
            if ($name -cnotmatch '^v(0|[1-9][0-9]{0,8})\.') {
              continue
            }
            $releaseMajor = [long]$Matches[1]
            $state = "release"
            if ($draft -eq "true") {
              $state = "draft"
            }
            if ($env:RELEASE_LINE -ne "") {
              if ($releaseMajor -gt $major -and ($prerelease -ne "true" -or $env:RELEASE_KIND -eq "dev")) {
                throw "The $state $name of a higher major ends release line $major; HACS would offer a later $major.x release over it."
              }
            }
            elseif ($draft -eq "true" -and $releaseMajor -lt $major) {
              throw "The draft $name of an older major would be ordered after $env:RELEASE_TAG once published; delete it first."
            }
          }

      # The tag does NOT exist yet after this step. GitHub records the target commit on
      # the draft and creates the tag when the draft is published — which is why a
      # discarded draft leaves nothing behind to clean up.
      - name: Create the unpublished draft against the approved commit
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          > Automatically built and tested release draft. Review and replace these notes before publishing.

          Target commit: \`$EXPECTED_SHA\`

          Release asset: \`$RELEASE_ASSET\`
          SHA-256: \`$EXPECTED_SHA256\`

          ## Release notes

          Replace this paragraph with the approved, user-facing release notes.

          ## Installation

          Install or update Room Climate Card through HACS. Reload the browser after the update.
          EOF
          if [[ "$RELEASE_KIND" == "dev" ]]; then
            cat >> "$notes_file" <<'EOF'

          ## Pre-release

          This is a development pre-release for testing. HACS offers it only where pre-releases are enabled for this repository.
          EOF
          fi

          # No --fail-on-no-commits: gh compares the latest release with the default branch, not
          # with the target, and refuses every release once two lines have diverged.
          args=(
            gh release create "$RELEASE_TAG"
            "release-asset/$RELEASE_ASSET"
            --repo "$GITHUB_REPOSITORY"
            --draft
            --target "$EXPECTED_SHA"
            --title "$RELEASE_TITLE"
            --notes-file "$notes_file"
          )
          if [[ "$RELEASE_KIND" == "dev" ]]; then
            args+=(--prerelease --latest=false)
          fi
          "${args[@]}"

          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Summarize the manual approval step
        shell: bash
        run: |
          {
            echo "## Unpublished release draft created"
            echo
            echo "Nothing has been published. HACS cannot see this draft."
            echo
            echo "- Draft: ${{ steps.draft.outputs.url }}"
            echo "- Tag to be created on publish: \`$RELEASE_TAG\`"
            echo "- Release kind: \`$RELEASE_KIND\`"
            echo "- Commit: \`$EXPECTED_SHA\`"
            echo "- Asset: \`$RELEASE_ASSET\`"
            echo "- SHA-256: \`$EXPECTED_SHA256\`"
            echo "- Characterization baseline anchor: \`$BASELINE_ANCHOR\`"
            echo
            echo "The repository owner must review the notes, asset and settings, then publish manually."
          } >> "$GITHUB_STEP_SUMMARY"
