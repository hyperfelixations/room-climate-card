# Dependency audit: any advisory against a runtime dependency fails, and every installed package
# needs a valid registry signature. Advisories against build and test tooling are reported by
# GitHub (Dependabot alerts and security updates) and do not stop CI: none of that code ships.
# The schedule catches advisories published without a new commit.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit dependencies and registry signatures
        run: npm run check:security
