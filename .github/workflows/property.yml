# The expensive generated and mutation checks, once a week. Not in CI: a sweep that draws
# different cards each run would eventually fail on an unrelated change. Weekly, not nightly:
# a custom card is not developed every day and a job that usually reports nothing goes
# unread. Two independent jobs: the property sweep (model + metamorphic, different case
# counts because a metamorphic case costs ~3x a model one) and mutation, kept parallel so a
# slow mutation cycle cannot hide the sweep result. See interne Doku §4 "GitHub-Workflows".
# A property failure prints a locally minimized scenario as lossless JSON, usable directly
# as a scenario(...) fixture; the JSON report records seed and census for replay. Known
# defects (test/known-issues.js) do not fail this job.

name: Weekly deep test sweeps

on:
  schedule:
    # Mondays, 04:17 UTC — off the hour, where GitHub's scheduled-workflow queue is congested.
    - cron: "17 4 * * 1"
  # So a generator change can be swept without waiting for Monday.
  workflow_dispatch:
    inputs:
      cases:
        description: "How many randomly described dashboards to try"
        required: false
        default: "50000"
      metamorphic_cases:
        description: "How many of those to also compare against a derived dashboard"
        required: false
        default: "20000"
      seed:
        description: "Optional unsigned 32-bit model seed (decimal or 0x-prefixed)"
        required: false
      metamorphic_seed:
        description: "Optional unsigned 32-bit metamorphic seed (decimal or 0x-prefixed)"
        required: false

permissions:
  contents: read

jobs:
  sweep:
    name: Property sweep
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the bundle from src/
        run: npm run build

      - name: Sweep
        env:
          # The scheduled run has no inputs, so the fallbacks apply. run_id changes per run
          # but is fixed across its reruns: new weeks explore new populations, a rerun stays
          # reproducible.
          ROOM_CLIMATE_CARD_FUZZ_CASES: ${{ github.event.inputs.cases || '50000' }}
          ROOM_CLIMATE_CARD_METAMORPHIC_CASES: ${{ github.event.inputs.metamorphic_cases || '20000' }}
          ROOM_CLIMATE_CARD_FUZZ_SEED: ${{ github.event.inputs.seed || github.run_id }}
          ROOM_CLIMATE_CARD_METAMORPHIC_SEED: ${{ github.event.inputs.metamorphic_seed || github.run_id }}
          ROOM_CLIMATE_CARD_PROPERTY_REPORT_DIR: test-results/property
        run: npm run test:property:run

      - name: Upload property reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: property-reports
          path: test-results/property/
          retention-days: 30

  mutation:
    name: Mutation quality
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Critical domain mutation tests
        run: npm run test:mutation

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-reports
          path: reports/mutation/
          retention-days: 30
